name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The workspace runs its suites and builds one package at a time; a full run takes longer than
    # half an hour on a standard runner (measured locally: tests ~20 min, builds ~7 min).
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # onnxruntime-node's postinstall (pulled in by @huggingface/transformers) tries to download an
      # optional CUDA 12 archive on linux-x64 when no CUDA library is present, and that archive 404s
      # on GitHub runners. ONNXRUNTIME_NODE_INSTALL_CUDA=skip is the package's own switch
      # (node_modules/onnxruntime-node/script/install.js): it skips only the CUDA binaries, so the
      # CPU runtime the CLIP image search uses is still installed. A `--config.*` flag cannot do
      # this: pnpm 11 does not forward --config.* to lifecycle scripts (verified locally).
      - run: pnpm install --frozen-lockfile
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
