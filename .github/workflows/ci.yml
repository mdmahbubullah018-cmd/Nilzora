name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The workspace runs its suites and builds one package at a time; a full run takes longer than
    # half an hour on a standard runner (measured locally: tests ~20 min, builds ~7 min).
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # onnxruntime-node's postinstall (pulled in by @huggingface/transformers) tries to download an
      # optional CUDA 12 archive on linux-x64 when no CUDA library is present, and that archive 404s
      # on GitHub runners. ONNXRUNTIME_NODE_INSTALL_CUDA=skip is the package's own switch
      # (node_modules/onnxruntime-node/script/install.js): it skips only the CUDA binaries, so the
      # CPU runtime the CLIP image search uses is still installed. A `--config.*` flag cannot do
      # this: pnpm 11 does not forward --config.* to lifecycle scripts (verified locally).
      - run: pnpm install --frozen-lockfile
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: pnpm run format:check
      # Expo Router writes the mobile app's typed-route union (.expo/types/router.d.ts) and
      # expo-env.d.ts. Its type-aware lint rules read them: without the file `Href` widens and the
      # four `as Href` assertions in the app look redundant. `expo customize tsconfig.json` is Expo's
      # own way of running that generation without starting the dev server.
      - run: pnpm --filter @nilzora/mobile exec expo customize tsconfig.json
      # Typecheck before lint: each Next.js app's typecheck script starts with `next typegen`, which
      # writes the route types (`PageProps<'/products/[slug]'>`, …) under .next/types. The type-aware
      # ESLint rules need them, and a fresh checkout has none, so linting first reports every route
      # parameter as an `error` type.
      - run: pnpm run typecheck
      - run: pnpm run lint
      # One package at a time: running the suites concurrently starves the runner and trips their
      # 5-second per-test timeouts, which pass whenever the same files run on their own.
      - run: pnpm -r --workspace-concurrency=1 run test
      - run: pnpm run build
