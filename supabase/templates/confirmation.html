<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f1f5f9;
      font-family: Arial, Helvetica, sans-serif;
      color: #334155;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            style="max-width: 480px; background: #ffffff; border-radius: 12px; padding: 32px"
          >
            <tr>
              <td>
                <p style="margin: 0 0 24px; font-size: 22px; font-weight: 600; color: #0f172a">
                  Nil<span style="color: #0284c7">zora</span>
                </p>
                <h1 style="margin: 0 0 12px; font-size: 20px; color: #0f172a">
                  Confirm your email address
                </h1>
                <p style="margin: 0 0 24px; font-size: 15px; line-height: 22px">
                  Thanks for creating a Nilzora account. Confirm this address to finish setting it
                  up.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{ .SiteURL }}/confirm-email?token_hash={{ .TokenHash }}"
                    style="
                      display: inline-block;
                      background: #0369a1;
                      color: #ffffff;
                      text-decoration: none;
                      font-weight: 600;
                      padding: 12px 20px;
                      border-radius: 8px;
                    "
                  >
                    Confirm email address
                  </a>
                </p>
                <p style="margin: 0; font-size: 13px; line-height: 20px; color: #64748b">
                  If you did not create a Nilzora account, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
