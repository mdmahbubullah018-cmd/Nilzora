packages:
  - apps/*
  - packages/*

# React Native's Android C++ builds cannot use pnpm's isolated layout on Windows.
# Each native module compiles inside its own package directory, and CMake/ninja
# mirror that absolute source path into every object path - twice. With the
# isolated layout the directory is `.pnpm/<pkg>@<version>_<peer-hash>/node_modules/
# <pkg>`, which pushes object paths past the Windows 260-character MAX_PATH limit
# (react-native-screens and react-native-worklets exceeded it by ~84 characters and
# failed with "ninja: error: mkdir(...): No such file or directory"). The SDK's
# CMake 3.22.1 and ninja 1.10.2 are not long-path aware, so raising the OS limit
# does not help; a hoisted layout shortens those paths by ~160 characters.
nodeLinker: hoisted

# Supply-chain protection. These match the pnpm 11 defaults and are stated
# explicitly so they survive a change of package manager version.
minimumReleaseAge: 1440
blockExoticSubdeps: true
strictDepBuilds: true

# Dependencies reviewed for install scripts: true = allowed to run, false = blocked.
allowBuilds:
  esbuild: true # installs and verifies its platform binary (used by tsx)
  sharp: false # ships prebuilt binaries; the script only builds from source
  unrs-resolver: false # ships prebuilt binaries (eslint import resolver)
  '@parcel/watcher': false # prebuilt @parcel/watcher-win32-x64 is used; the script only builds from source
  # CLIP image embeddings run locally (image search); this script fetches the platform binary.
  onnxruntime-node: true
  protobufjs: false # prints a funding message only

# Security floors for transitive dependencies (within the ranges their parents declare).
# body-parser < 2.4.0 has a high-severity denial of service via trailing bytes
# (GHSA advisory); express 5.3.0 depends on body-parser ^2.3.0, so 2.4.x is compatible.
overrides:
  body-parser: ^2.4.0

