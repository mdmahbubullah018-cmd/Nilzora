  # node_modules/expo/bundledNativeModules.json) and @types/react is 19.3.0, so the web
  # apps use it too. Two versions under the hoisted layout produced two physical React
  # copies and every admin component test failed with "Invalid hook call".
  react: 19.3.0
  react-dom: 19.3.0
  server-only: 0.0.1
  sharp: 0.35.5
  socket.io: 4.8.4
  socket.io-client: 4.8.4
